<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gameplay Booster PRO</title>
<style>
:root{--bg:#090b12;--card:#141826;--ac:#ff3d5a;--ac2:#7c5cff;--tx:#eef0f8;--mu:#8b90a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:14px;max-width:820px;margin:auto}
h1{font-size:1.5rem;margin:6px 0}h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.s{color:var(--mu);margin:0 0 12px;font-size:.9rem}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.drop{border:2px dashed var(--ac2);text-align:center;padding:26px;border-radius:14px;cursor:pointer}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden}
canvas{width:100%;display:block;max-height:62vh;object-fit:contain}video{display:none}
.tag{position:absolute;top:8px;font-size:.75rem;background:#000a;padding:3px 8px;border-radius:8px}
label{display:block;font-size:.82rem;color:var(--mu);margin-top:9px}label b{color:var(--tx);float:right}
input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,select,input[type=number]{background:var(--ac2);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:.95rem;flex:1}
button.go{background:var(--ac);font-weight:700;font-size:1.05rem}button:disabled{opacity:.5}
button.chip{background:#232842;flex:none}select,input[type=number]{background:#232842}
.bar{height:10px;background:#232842;border-radius:5px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
small{color:var(--mu)}h3{margin:0 0 4px;font-size:1rem}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<h1>🎮 Gameplay <span>Booster PRO</span></h1>
<p class="s">Vrai moteur : interpolation 60 fps par mouvement (GPU), netteté, couleurs, export MP4 H.264 + son. 100 % dans ton navigateur (Chrome / Edge).</p>

<div class="card"><div class="drop" id="drop">📂 Choisir une vidéo gameplay<input id="file" type="file" accept="video/*" hidden></div></div>

<div id="work" style="display:none">
<div class="card">
 <div class="stage"><canvas id="cv"></canvas><span class="tag" style="left:8px">AVANT</span><span class="tag" style="right:8px">APRÈS</span>
 <div id="line" style="position:absolute;top:0;bottom:0;width:2px;background:#fff;left:50%"></div></div>
 <label>↔ Comparer avant / après</label><input id="split" type="range" min="0" max="100" value="50">
 <div class="row"><button id="pp">▶ Lecture</button><button class="chip" id="t0b">✂ Début ici</button><button class="chip" id="t1b">✂ Fin ici</button></div>
 <input id="seek" type="range" min="0" max="1000" value="0" style="margin-top:8px">
 <small id="tinfo"></small>
</div>

<div class="card"><h3>🎨 Style</h3>
 <div class="row" style="margin-top:4px">
  <button class="chip" data-p="gaming">🔥 Gaming punch</button><button class="chip" data-p="ff">💥 Free Fire vif</button>
  <button class="chip" data-p="nat">🌿 Naturel</button><button class="chip" data-p="cine">🎬 Cinéma</button></div>
 <label>Netteté <b id="o_sharp"></b></label><input id="sharp" type="range" min="0" max="100">
 <label>Contraste <b id="o_con"></b></label><input id="con" type="range" min="80" max="150">
 <label>Couleurs <b id="o_sat"></b></label><input id="sat" type="range" min="70" max="180">
 <label>Éclat (vibrance) <b id="o_vib"></b></label><input id="vib" type="range" min="0" max="100">
 <label>Luminosité <b id="o_bri"></b></label><input id="bri" type="range" min="80" max="125">
</div>

<div class="card"><h3>⚡ Export</h3>
 <div class="g2">
  <div><label>Format</label><select id="fmt"><option value="tt">TikTok / Reels 1080×1920</option><option value="yt">YouTube 1920×1080</option><option value="orig">Taille d'origine</option></select></div>
  <div><label>Qualité (débit)</label><select id="br"><option value="8">Standard 8 Mb/s</option><option value="14" selected>Haute 14 Mb/s</option><option value="22">Max 22 Mb/s</option></select></div>
  <div><label>Fluidité 60 fps</label><select id="fl"><option value="1" selected>Estimation de mouvement (GPU)</option><option value="0">Désactivée</option></select></div>
  <div><label>Précision du mouvement</label><select id="qn"><option value="2">Rapide (téléphone)</option><option value="3" selected>Précise (PC)</option></select></div>
 </div>
 <label>Cadrage horizontal (si le format coupe l'image) <b id="o_cam"></b></label><input id="cam" type="range" min="0" max="100" value="50">
 <div class="row"><button class="go" id="exp">⚡ Exporter en MP4</button></div>
 <div class="bar"><i id="pg"></i></div><small id="st">Prêt.</small>
 <video id="out" controls playsinline style="display:block;width:100%;margin-top:10px;border-radius:10px;max-height:50vh"></video>
 <div class="row"><a id="dl" style="display:none;flex:1"><button style="width:100%" class="go">⬇ Télécharger la vidéo</button></a></div>
</div>
</div>
<video id="v" playsinline muted></video>

<script type="module">
import {Muxer,ArrayBufferTarget} from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.mjs';
const $=i=>document.getElementById(i),v=$('v'),cv=$('cv'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
let file=null,start=0,end=0,exporting=false,previewing=false;
const PRE={gaming:{sharp:60,con:115,sat:125,vib:30,bri:100},ff:{sharp:55,con:112,sat:140,vib:40,bri:104},nat:{sharp:35,con:105,sat:108,vib:15,bri:100},cine:{sharp:30,con:120,sat:95,vib:10,bri:96}};
const KEYS=['sharp','con','sat','vib','bri','cam'];
function setP(p){for(const k in p)$(k).value=p[k];upd()}
function upd(){KEYS.forEach(k=>$('o_'+k).textContent=$(k).value+'%');$('line').style.left=$('split').value+'%';if(!previewing&&!exporting&&v.videoWidth)render(0,+$('split').value/100)}
KEYS.forEach(k=>$(k).oninput=upd);$('split').oninput=upd;
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setP(PRE[b.dataset.p]));

/* ---------- WebGL ---------- */
const VS=`#version 300 es
in vec2 p;out vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform sampler2D uA,uB;uniform vec2 uTexel;uniform vec4 uCrop;uniform int uMode,uN;
uniform float uSharp,uCon,uSat,uVib,uBri,uSplit,uStep;
in vec2 vUv;out vec4 o;vec2 gd;
vec3 L(sampler2D t,vec2 q,float l){return textureLod(t,q,l).rgb;}
float cost(vec2 p,vec2 d,float sp,float l){
 float c=dot(abs(L(uA,p-d,l)-L(uB,p+d,l)),vec3(1.));
 vec2 k[4]=vec2[4](vec2(sp,0.),vec2(-sp,0.),vec2(0.,sp),vec2(0.,-sp));
 for(int i=0;i<4;i++){vec2 q=k[i]*uTexel;c+=dot(abs(L(uA,p-d+q,l)-L(uB,p+d+q,l)),vec3(1.));}
 return c;}
vec3 samp(vec2 p){return uMode==0?texture(uB,p).rgb:.5*(texture(uA,p-gd).rgb+texture(uB,p+gd).rgb);}
void main(){
 vec2 p=vUv*uCrop.xy+uCrop.zw;gd=vec2(0.);
 if(uMode==1){
  float best=cost(p,vec2(0.),uStep*.8,2.)*.85;vec2 bd=vec2(0.);
  for(int y=-3;y<=3;y++)for(int x=-3;x<=3;x++){
   if(abs(x)>uN||abs(y)>uN||(x==0&&y==0))continue;
   vec2 d=vec2(float(x),float(y))*uStep*uTexel;
   float c=cost(p,d,uStep*.8,2.)+.04*length(vec2(float(x),float(y)));
   if(c<best){best=c;bd=d;}}
  float b2=cost(p,bd,uStep*.4,1.);vec2 b2d=bd;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
   if(x==0&&y==0)continue;
   vec2 d=bd+vec2(float(x),float(y))*(uStep/3.)*uTexel;
   float c=cost(p,d,uStep*.4,1.);if(c<b2){b2=c;b2d=d;}}
  gd=b2<1.8?b2d:vec2(0.);}
 vec3 c=samp(p);
 vec3 bl=.25*(samp(p+vec2(uTexel.x,0.))+samp(p-vec2(uTexel.x,0.))+samp(p+vec2(0.,uTexel.y))+samp(p-vec2(0.,uTexel.y)));
 c+=(c-bl)*uSharp*2.;
 c=(c-.5)*uCon+.5;c*=uBri;
 float l=dot(c,vec3(.2126,.7152,.0722));float s=max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b));
 c=mix(vec3(l),c,1.+uVib*(1.-s));c=mix(vec3(dot(c,vec3(.2126,.7152,.0722))),c,uSat);
 if(uSplit>=0.){if(vUv.x<uSplit)c=texture(uB,p).rgb;}
 o=vec4(clamp(c,0.,1.),1.);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={};const u=n=>U[n]||(U[n]=gl.getUniformLocation(pr,n));
const T=[0,1].map(()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t});
let cur=0,prv=1;
function push(){[prv,cur]=[cur,prv];gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,T[cur]);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);gl.generateMipmap(gl.TEXTURE_2D)}
function outSize(){const w=v.videoWidth,h=v.videoHeight,f=$('fmt').value;
 if(f==='tt')return[1080,1920];if(f==='yt')return[1920,1080];return[w&~1,h&~1]}
function crop(W,H){const sa=v.videoWidth/v.videoHeight,oa=W/H;let sx=1,sy=1,ox=0,oy=0;
 if(sa>oa){sx=oa/sa;ox=(1-sx)*(+$('cam').value/100)}else{sy=sa/oa;oy=(1-sy)/2}return[sx,sy,ox,oy]}
function render(mode,split=-1){
 const[W,H]=outSize();if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
 gl.viewport(0,0,W,H);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,T[prv]);gl.uniform1i(u('uA'),0);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,T[cur]);gl.uniform1i(u('uB'),1);
 gl.uniform2f(u('uTexel'),1/v.videoWidth,1/v.videoHeight);gl.uniform4fv(u('uCrop'),crop(W,H));
 gl.uniform1i(u('uMode'),mode);gl.uniform1i(u('uN'),+$('qn').value);
 gl.uniform1f(u('uSharp'),$('sharp').value/100*.9);gl.uniform1f(u('uCon'),$('con').value/100);
 gl.uniform1f(u('uSat'),$('sat').value/100);gl.uniform1f(u('uVib'),$('vib').value/100);gl.uniform1f(u('uBri'),$('bri').value/100);
 gl.uniform1f(u('uSplit'),split);gl.uniform1f(u('uStep'),Math.max(2,v.videoHeight/90));
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
$('fmt').onchange=upd;

/* ---------- Chargement / aperçu ---------- */
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{file=e.target.files[0];if(!file)return;v.src=URL.createObjectURL(file);
 v.onloadedmetadata=async()=>{$('drop').style.display='none';$('work').style.display='block';start=0;end=v.duration;setP(PRE.gaming);v.currentTime=0.01;await new Promise(r=>v.onseeked=r);v.onseeked=null;push();push();upd();info()}};
function info(){$('tinfo').textContent=`Découpe : ${start.toFixed(1)} s → ${end.toFixed(1)} s  (${v.videoWidth}×${v.videoHeight})`}
$('t0b').onclick=()=>{start=Math.min(v.currentTime,end-.2);info()};$('t1b').onclick=()=>{end=Math.max(v.currentTime,start+.2);info()};
$('seek').oninput=async()=>{if(previewing||exporting)return;v.currentTime=$('seek').value/1000*v.duration;await new Promise(r=>v.onseeked=r);v.onseeked=null;push();upd()};
function pvLoop(){if(!previewing)return;v.requestVideoFrameCallback(()=>{push();render(0,+$('split').value/100);$('seek').value=v.currentTime/v.duration*1000;pvLoop()})}
$('pp').onclick=()=>{if(exporting)return;if(previewing){previewing=false;v.pause();$('pp').textContent='▶ Lecture'}else{previewing=true;v.muted=false;v.playbackRate=1;v.play();$('pp').textContent='⏸ Pause';pvLoop()}};
v.onended=()=>{if(previewing){previewing=false;$('pp').textContent='▶ Lecture'}};

/* ---------- Export ---------- */
const msg=t=>$('st').textContent=t;
$('exp').onclick=async()=>{
 if(!('VideoEncoder' in window)){msg('❌ Ouvre le site dans Chrome ou Edge (WebCodecs requis).');return}
 previewing=false;v.pause();exporting=true;$('exp').disabled=true;$('dl').style.display='none';$('pp').textContent='▶ Lecture';
 try{await doExport()}catch(e){console.error(e);msg('❌ Erreur : '+e.message)}
 exporting=false;$('exp').disabled=false};
async function doExport(){
 const[W,H]=outSize(),br=+$('br').value*1e6;
 let codec=null;for(const c of['avc1.640033','avc1.64002A','avc1.4d002a','avc1.42002a']){
  if((await VideoEncoder.isConfigSupported({codec:c,width:W,height:H,bitrate:br,framerate:60})).supported){codec=c;break}}
 if(!codec)throw new Error('Encodeur H.264 non supporté pour cette taille (essaie « Taille d\'origine »).');
 /* audio */
 let ab=null;msg('Préparation du son…');
 try{if(file.size<400e6&&'AudioEncoder'in window){const ac=new AudioContext();ab=await ac.decodeAudioData(await file.arrayBuffer());
  if(!(await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:ab.sampleRate,numberOfChannels:Math.min(2,ab.numberOfChannels),bitrate:160000})).supported)ab=null}}catch(e){ab=null}
 const ch=ab?Math.min(2,ab.numberOfChannels):0;
 const muxer=new Muxer({target:new ArrayBufferTarget(),video:{codec:'avc',width:W,height:H,frameRate:60},
  ...(ab?{audio:{codec:'aac',numberOfChannels:ch,sampleRate:ab.sampleRate}}:{}),fastStart:'in-memory'});
 const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{throw e}});
 enc.configure({codec,width:W,height:H,bitrate:br,framerate:60,latencyMode:'quality'});
 v.muted=true;v.playbackRate=1;v.currentTime=start;await new Promise(r=>v.onseeked=r);v.onseeked=null;
 const interp=$('fl').value==='1';let prevMT=null,lastTs=-1,n=0,t0=performance.now(),finished=false;
 const put=(ts)=>{ts=Math.max(ts,lastTs+1);lastTs=ts;const f=new VideoFrame(cv,{timestamp:ts});enc.encode(f,{keyFrame:n++%120===0});f.close()};
 await new Promise(async resolve=>{
  const fin=()=>{if(finished)return;finished=true;v.pause();resolve()};
  v.onended=fin;
  const cb=async(now,md)=>{
   if(finished)return;if(md.mediaTime>=end){fin();return}
   push();const ts=Math.round((md.mediaTime-start)*1e6);
   if(interp&&prevMT!==null){const gap=md.mediaTime-prevMT;
    if(gap>.02&&gap<.07){render(1);put(Math.round((prevMT-start+gap/2)*1e6))}}
   render(0);put(ts);prevMT=md.mediaTime;
   const el=(performance.now()-t0)/1000,done=md.mediaTime-start,tot=end-start;
   $('pg').style.width=(done/tot*92)+'%';msg(`Encodage ${(done/tot*100).toFixed(0)} % — reste ~${Math.max(0,Math.round(el/Math.max(done,.1)*(tot-done)))} s (garde l'onglet ouvert)`);
   if(enc.encodeQueueSize>6){v.pause();while(enc.encodeQueueSize>2)await sleep(8);if(!finished)v.play()}
   v.requestVideoFrameCallback(cb)};
  v.requestVideoFrameCallback(cb);v.play()});
 await enc.flush();
 if(ab){msg('Encodage du son…');const sr=ab.sampleRate,s0=Math.floor(start*sr),s1=Math.min(ab.length,Math.floor(end*sr));
  const ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:console.error});
  ae.configure({codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:ch,bitrate:160000});
  for(let i=s0;i<s1;i+=4096){const len=Math.min(4096,s1-i),d=new Float32Array(len*ch);
   for(let c=0;c<ch;c++)d.set(ab.getChannelData(c).subarray(i,i+len),c*len);
   ae.encode(new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:len,numberOfChannels:ch,timestamp:Math.round((i-s0)/sr*1e6),data:d}));
   if(ae.encodeQueueSize>40)await sleep(0)}
  await ae.flush()}
 muxer.finalize();const url=URL.createObjectURL(new Blob([muxer.target.buffer],{type:'video/mp4'}));
 $('out').src=url;$('dl').href=url;$('dl').download='gameplay-boost.mp4';$('dl').style.display='flex';$('pg').style.width='100%';
 msg(`✅ Terminé ! ${(muxer.target.buffer.byteLength/1e6).toFixed(1)} Mo${ab?'':' (sans son : non supporté)'}`);
 v.currentTime=start;await new Promise(r=>v.onseeked=r);v.onseeked=null;push();upd()}
</script></body></html>
